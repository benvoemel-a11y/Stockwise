<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8a8a8a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#8a8a8a">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<title>Filer</title>
<style>
:root{color-scheme:light only;--bg:#8a8a8a;--ink:#171717;--mid:#464646;--soft:#676767;--press:#838383;--red:#d93f37}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;line-height:1.5;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
 padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 60px + var(--kb,0px)) calc(env(safe-area-inset-left) + 18px);box-sizing:border-box}
.fade{animation:fin .42s ease}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .42s ease}@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:600;min-height:40px}
.ic{color:var(--mid);display:inline-flex;align-items:center;padding:8px;margin:-8px;transition:color .3s,transform .45s}.ic:active{color:#000000;transform:scale(.85)}
.ic svg{width:20px;height:20px}.gear svg{width:22px;height:22px}.gear.spin{animation:gspin .55s cubic-bezier(.4,0,.2,1) forwards}@keyframes gspin{to{transform:rotate(120deg)}}

/* Zeilen */
.row{position:relative;overflow:hidden}
.rin{position:relative;z-index:1;display:flex;align-items:baseline;gap:14px;padding:9px 10px;background:var(--bg);transition:transform .3s cubic-bezier(.2,.9,.25,1),background .3s;will-change:transform;backface-visibility:hidden}
.row:active .rin{background:var(--press)}
.acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.acts span{width:58px;display:flex;align-items:center;justify-content:center}.acts svg{width:16px;height:16px}
.ae{background:#7a7a7a;color:#1f1f1f}.ax{background:#1f1f1f;color:#a0a0a0}
.row .n{flex:1;min-width:0;color:var(--ink);transition:color .3s ease;word-break:break-word}
.row .nt{background:linear-gradient(#2f2f2f,#2f2f2f) no-repeat 0 56%/0 2px;transition:background-size .32s cubic-bezier(.4,0,.2,1)}
.row .t{color:var(--mid);text-align:right;transition:color .35s;white-space:nowrap}.row .r{color:#5b5b5b;white-space:nowrap}
.row.late:not(.done) .n,.row.late:not(.done) .t{color:var(--red)}
.done .n{color:var(--soft)}.done .nt{background-size:100% 2px}.done .t{color:var(--soft)}
.out{transition:height .45s ease,opacity .4s ease,margin .45s ease!important;opacity:0}
.pm{display:inline-flex;align-items:center;justify-content:center;width:12px;color:#4f4f4f;flex:none;align-self:center}.pm svg{width:12px;height:12px}.pm.sp{visibility:hidden}
.prio .nt{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:#1f1f1f}.prio.done .nt{text-decoration:none}.prio.done .pm{color:#737373}
.row.late:not(.done) .nt{text-decoration-color:var(--red)}
.row.dragging{z-index:3;transition:none!important}.row.dragging .rin{background:var(--press);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.row.shift{transition:transform .24s ease}
.s1 .rin{font-size:13px;padding:6px 10px}.s2 .row{margin-bottom:4px}.s3 .row{margin-bottom:8px}.s3 .rin{padding:12px 14px;font-size:20px;font-weight:600}

/* Hinzufügen / Bearbeiten */
/* Runder, schwebender Plus-Knopf unten rechts */
.plus{position:fixed;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:58px;height:58px;border-radius:50%;background:#2c2c2c;color:#cfcfcf;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:300;line-height:1;padding:0 0 3px;margin:0;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5;transition:transform .2s ease,background .2s}
.plus:active{transform:scale(.9);background:#1f1f1f}
.plus{display:none!important}
.taphint{padding:9px 10px;color:#4f4f4f;font-size:13px}
.plus.spin{animation:pspin .25s ease-out forwards;pointer-events:none;z-index:20;right:auto!important;bottom:auto!important}@keyframes pspin{to{transform:rotate(90deg) scale(.85);opacity:0}}
.addrow{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;margin-top:10px;background:#949494}
.addrow input{all:unset;font-family:inherit;font-size:16px;line-height:44px;height:44px;color:var(--ink);caret-color:var(--ink);-webkit-user-select:text;user-select:text}
/* Im Eingabefeld: Cursor mit Finger ziehen, Lupe und Leertasten-Trackpad erlauben */
.addrow textarea.fn{all:unset;flex:1;min-width:0;font-family:inherit;font-size:16px;line-height:22px;padding:11px 0;color:var(--ink);caret-color:var(--ink);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;resize:none;overflow:hidden;display:block;box-sizing:content-box;min-height:22px}
.addrow textarea,.addrow input,.addrow input *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important;touch-action:auto!important;cursor:text;overflow:hidden;text-overflow:clip}
.addrow input::placeholder{color:#6b6b6b}
.addrow .fn{flex:1;min-width:0}.addrow .ft{width:56px;text-align:right}
.clk,.pri{color:#737373;display:inline-flex;align-items:center;padding:10px 4px;transition:color .2s,transform .15s}.clk svg{width:18px;height:18px}.pri svg{width:15px;height:15px}
.clk:active,.pri:active{transform:scale(.8)}.pri.on{color:var(--ink)}
.days{display:flex;gap:4px;padding:6px 4px 0;font-size:15px;flex-wrap:wrap}.dy{color:var(--soft);padding:6px 6px;transition:color .2s,transform .15s}.dy:active{transform:scale(.85)}.dy.on{color:#2b2b2b;text-decoration:underline}
.stripw+.plus,.hd+.plus{margin-top:0}.stripw+.addwrap .addrow,.hd+.addwrap .addrow{margin-top:0}
.stripw{display:flex;align-items:center;gap:12px;margin-bottom:18px}#pct{font-size:12px;color:#2b2b2b;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.closing{transition:opacity .25s ease,transform .25s ease;opacity:0;transform:translateY(-3px)}
.editwrap{margin:0 0 6px}.editwrap .addrow{margin-top:0}
.dline{align-items:center}.dline .dl{color:#2b2b2b;min-width:0}

/* Menü, Kalender */
.mi{padding:14px 10px;transition:background .3s,padding-left .3s}.mi:active{background:#7c7c7c;padding-left:14px}
.opts{display:flex;gap:22px;padding:2px 10px 12px;align-items:baseline}.opt{color:#5b5b5b;padding:4px 0;transition:color .2s}.opt:active{color:#000000}.opt.on{color:var(--ink);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-bottom:18px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.calhd .ic{font-size:22px;padding:4px 12px;margin:0 -12px}.calm{font-weight:700;font-size:20px}
.calsub{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#4f4f4f;margin-bottom:18px}.calsub b{color:var(--ink);font-weight:700}
.cwd{font-size:12px;color:#4f4f4f;padding:2px 0 4px}
.cd{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#949494;color:#2f2f2f;font-size:14px;transition:background .3s,color .3s,transform .12s,box-shadow .2s}.cd:active{transform:scale(.9)}
.cd.has{font-weight:700}.cd.full{background:#373737;color:#b0b0b0}.cd.fut{background:#919191;color:#737373}.cd.fut.has{color:#464646}.cd.today{text-decoration:underline;text-underline-offset:3px}.cd.sel{background:#686868;color:#b5b5b5;font-weight:700}
.muted{color:#595959}
.dnav{display:flex;align-items:center;gap:4px}.ar{color:var(--mid);font-weight:400;padding:6px 8px;font-size:18px;transition:color .2s,transform .15s}.ar:first-child{margin-left:-8px}.ar:active{color:#000000}
@keyframes kl{0%,100%{transform:none}40%{transform:translateX(-6px)}}@keyframes kr{0%,100%{transform:none}40%{transform:translateX(6px)}}.kl{animation:kl .42s ease}.kr{animation:kr .42s ease}
@keyframes flipO{to{opacity:0;transform:translateY(-8px)}}@keyframes flipI{from{opacity:0;transform:translateY(8px)}}.dtx{display:inline-block}
.slL{animation:slL .36s ease}.slR{animation:slR .36s ease}@keyframes slL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}@keyframes slR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,6px);background:#7e7e7e;color:#1f1f1f;font-size:13px;padding:6px 12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
#file{display:none}
.mrow{display:flex;align-items:center;gap:8px}.mrow .sp{flex:1}.dw{width:66px;text-align:center}.reveal .hit{padding:10px 12px;margin:-10px -12px;position:relative;z-index:1;touch-action:manipulation}.reveal .hit i{font-style:normal;display:inline-block}
.reveal{display:inline-flex;align-items:center;gap:8px;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);opacity:0;transform:translateX(-10px);pointer-events:none;transition:clip-path .32s ease,-webkit-clip-path .32s ease,opacity .25s,transform .32s ease}.mrow.open .reveal{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);opacity:1;transform:none;pointer-events:auto}
.dw{position:relative;display:inline-block;height:1.5em;line-height:1.5em;overflow:hidden;vertical-align:middle;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}.trk>div{height:1.5em;text-align:center;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json">
<script>
"use strict";
/* Zwei getrennte Filer-Apps aus demselben Code: /filer/ und /filer-2/.
   Jede hat eigenen Speicher, eigenen Verlauf und eine eigene Sync-Datei. */
const APP=location.pathname.includes("/filer-2/")?"filer2":"filer";
const VERSION="v31";
const W=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"],WS=["Mo","Di","Mi","Do","Fr","Sa","So"],
M=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
S=["klein","normal","groß"];
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const XX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const FLAG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5z"/><path d="M7 4h11l-3 4.5L18 13H7z"/></svg>';
const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const noon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
const wd=d=>(d.getDay()+6)%7;
const nice=d=>W[wd(d)]+", "+d.getDate()+". "+M[d.getMonth()];
const short=d=>WS[wd(d)]+", "+d.getDate()+". "+M[d.getMonth()].slice(0,3);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Math.random().toString(16).slice(2,10);
const D=k=>new Date(k+"T12:00:00");
const $=s=>document.querySelector(s);

/* ---------- Daten (bleiben nur auf diesem iPhone) ---------- */
const BASE={days:{},routines:[],rdone:{},rskip:{},order:{},size:1};
let st=Object.assign({},BASE,(()=>{try{return JSON.parse(localStorage.getItem(APP)||"null")}catch(e){return null}})()||{});
for(const k of ["days","rdone","rskip","order"])if(!st[k]||typeof st[k]!="object")st[k]={};
if(!Array.isArray(st.routines))st.routines=[];
function save(){for(const k of ["days","rdone","rskip","order"])for(const d in st[k])if(!st[k][d]||!st[k][d].length)delete st[k][d];
st.updatedAt=Date.now();storeLocal();schedulePush()}
function storeLocal(){const json=JSON.stringify(st);try{localStorage.setItem(APP,json)}catch(_){toast("speichern fehlgeschlagen")}idbSave(json)}

/* ---------- Zweite Kopie + Verlauf (IndexedDB) ----------
   Jede Änderung wird zusätzlich als Stand im Verlauf abgelegt (die letzten 300). */
let idbP=null,lastSnap=null;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{try{const r=indexedDB.open(APP,1);
 r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore("kv");db.createObjectStore("snaps",{keyPath:"t"})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function idbSave(json){try{if(lastSnap===null){const all=(await idbGet("snaps"))||[];lastSnap=all.length?all.reduce((a,b)=>a.t>b.t?a:b).json:""}const db=await idb(),tx=db.transaction(["kv","snaps"],"readwrite");tx.objectStore("kv").put(json,"state");
 if(json!==lastSnap){lastSnap=json;const s=tx.objectStore("snaps");s.put({t:Date.now(),json});
  const kr=s.getAllKeys();kr.onsuccess=()=>{const k=kr.result;if(k.length>300)k.slice(0,k.length-300).forEach(x=>s.delete(x))}}}catch(_){}}
function idbGet(store,key){return idb().then(db=>new Promise(res=>{const r=key==null?db.transaction(store).objectStore(store).getAll():db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})).catch(()=>null)}
function countOf(d){let n=d.routines?d.routines.length:0,f=0;for(const k in d.days||{}){n+=d.days[k].length;f+=d.days[k].filter(x=>x.done).length}for(const k in d.rdone||{})f+=d.rdone[k].length;return [n,f]}
function loadState(d){st=Object.assign({},BASE,d);delete st.level;for(const k of ["days","rdone","rskip","order"])if(!st[k]||typeof st[k]!="object")st[k]={};if(!Array.isArray(st.routines))st.routines=[]}
async function loadHist(){const box=$("#hist");if(!box)return;const all=(await idbGet("snaps"))||[];all.sort((a,b)=>b.t-a.t);
 if(!all.length){box.innerHTML='<div class="muted" style="padding:9px 10px">noch kein Verlauf</div>';return}
 box.innerHTML=all.map(x=>{const d=new Date(x.t);let n=[0,0];try{n=countOf(JSON.parse(x.json))}catch(_){}
  return `<div class="row" onclick="restoreSnap(${x.t})"><div class="rin"><span class="n">${short(d)}</span><span class="t">${n[0]} · ${n[1]} erledigt · ${pad(d.getHours())}:${pad(d.getMinutes())}</span></div></div>`}).join("")}
async function restoreSnap(t){const all=(await idbGet("snaps"))||[],x=all.find(y=>y.t===t);if(!x)return;
 const d=new Date(t);if(!confirm("Auf den Stand von "+short(d)+", "+pad(d.getHours())+":"+pad(d.getMinutes())+" zurücksetzen?"))return;
 try{loadState(JSON.parse(x.json));save();haptic();view="main";cur=T;render();toast("Stand wiederhergestellt")}catch(_){toast("Stand defekt")}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}

function items(d){const k=iso(d),dn=st.rdone[k]||[],sk=st.rskip[k]||[];
return [...(st.days[k]||[]).map(h=>({name:h.name,time:h.time,done:h.done,prio:!!h.prio,key:"h"+h.id})),
...st.routines.filter(r=>r.days.includes(wd(d))&&!sk.includes(r.id)).map(r=>({name:r.name,time:r.time,done:dn.includes(r.id),prio:!!r.prio,key:"r"+r.id}))]
.sort((a,b)=>(a.time==null)-(b.time==null)||(a.time||"").localeCompare(b.time||""))
.sort((()=>{const o=st.order[k];if(!o)return()=>0;const ix=new Map(o.map((x,i)=>[x,i]));const p=x=>ix.has(x.key)?ix.get(x.key):1e9;return(a,b)=>p(a)-p(b)})())}
function setDone(k,key){const id=key.slice(1);if(key[0]=="h"){const x=(st.days[k]||[]).find(x=>x.id==id);if(!x)return false;x.done=!x.done;save();return x.done}
const l=st.rdone[k]=st.rdone[k]||[];const i=l.indexOf(id);if(i<0)l.push(id);else l.splice(i,1);save();return i<0}

/* ---------- Zustand ---------- */
let slide="",T=noon(new Date()),cur=T,view="main",sel=T,adding=false,addKey=null,openOpt=null,newDays=[0,1,2,3,4,5,6],anim=true,editing=null,edDays=[];
const TM=()=>new Date(T.getFullYear(),T.getMonth(),T.getDate()+1,12);

/* ---------- Bausteine ---------- */
function rowH({cls="",key,name,tap="",pm="",inner,edit,remove}){
return `<div class="row ${cls}" data-key="${key}" data-n="${esc(name)}"${tap?` onclick="${tap}"`:""}><div class="rin">${pm}${inner}</div>`+
`<div class="acts"><span class="ae" onclick="event.stopPropagation();${edit}">${PEN}</span><span class="ax" onclick="event.stopPropagation();${remove}">${XX}</span></div></div>`}
const flag=(any,on)=>any?`<span class="pm ${on?"":"sp"}">${FLAG}</span>`:"";
const nameH=n=>`<span class="n"><span class="nt">${esc(n)}</span></span>`;

function rows(d,hide){let h=items(d);const all=h.length;if(hide)h=h.filter(x=>!x.done);
if(!h.length&&!all&&view=="main"&&!adding)return '<div class="taphint">tippen, um etwas hinzuzufügen</div>';
if(!h.length)return hide&&all?'<div class="muted" style="padding:9px 10px">alles erledigt</div>':(view=="cal"?'<div class="muted" style="padding:9px 10px">keine Einträge</div>':"");
const k=iso(d),anyP=h.some(x=>x.prio)||(view=="main"&&k==iso(T)&&Object.keys(st.days).some(q=>q<iso(T)&&st.days[q].some(x=>!x.done&&x.prio)));
return '<div class="s'+(st.size+1)+'" id="lst" data-day="'+k+'">'+h.map(x=>rowH({cls:(x.done?"done ":"")+(x.prio?"prio":""),key:x.key,name:x.name,
 tap:`tg('${k}','${x.key}',${hide},this)`,pm:flag(anyP,x.prio),inner:nameH(x.name)+`<span class="t">${x.time||""}</span>`,
 edit:`editItem('${k}','${x.key}',this.closest('.row'))`,remove:`del('${k}','${x.key}',this.closest('.row'))`})).join("")+'</div>'}
function carryRows(){const t=iso(T),out=[];
Object.keys(st.days).filter(k=>k<t).sort().forEach(k=>(st.days[k]||[]).filter(h=>!h.done).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).forEach(h=>out.push({k,h})));
if(!out.length)return "";const anyC=out.some(o=>o.h.prio)||items(T).some(x=>x.prio&&!x.done);
return '<div class="s'+(st.size+1)+'" id="carry">'+out.map(({k,h})=>{const d=D(k),r=relDay(d),lab=(r||WS[wd(d)]+" "+d.getDate()+"."+(d.getMonth()+1)+".")+(h.time?" "+h.time:"");

function roll(w,txt,dir){if(w._a){w._a.cancel();w._a=null}const prev=w._cur!=null?w._cur:w.textContent;w._cur=txt;
const tr=document.createElement("div");tr.className="trk";const a=document.createElement("div"),b=document.createElement("div");

/* ---------- Haptisches Feedback ----------

const hapEl=null;
/* Für jedes Tippen ein frischer versteckter Schalter im <head> – so löst iOS (ab 18) zuverlässig die Taptic Engine aus. */
function hapOnce(){try{const l=document.createElement("label");l.setAttribute("aria-hidden","true");l.style.display="none";
 const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);document.head.appendChild(l);l.click();document.head.removeChild(l)}catch(_){}}

 const pulse=()=>{const a=document.activeElement;if(a&&(a.tagName=="INPUT"||a.tagName=="TEXTAREA"))return;hapOnce()};

if(view=="cal")setTimeout(()=>{anim=false;keepScroll(render)},400);
if(hide&&now){el.dataset.busy=1;setTimeout(()=>collapse(el,emptyCheck),550)}}

let moved=null;
if(e.rid){const r=st.routines.find(x=>x.id==e.rid);if(r&&edDays.length){r.name=n;r.time=pt.time;r.days=edDays.slice();r.prio=prio}}
else{const nk=iso(e.date),id=e.key.slice(1);
 if(e.key[0]=="h"){const list=st.days[e.k]||[],h=list.find(x=>x.id==id);if(h){h.name=n;h.time=pt.time;h.prio=prio;
  if(nk!==e.k){st.days[e.k]=list.filter(x=>x.id!=id);(st.days[nk]=st.days[nk]||[]).push(h);if(st.order[e.k])st.order[e.k]=st.order[e.k].filter(x=>x!=e.key);moved=e.date}}}
 else{const r=st.routines.find(x=>x.id==id);if(r){
  if(nk!==e.k){(st.rskip[e.k]=st.rskip[e.k]||[]).push(id);
   const done=(st.rdone[e.k]||[]).includes(id);(st.days[nk]=st.days[nk]||[]).push({id:newId(),name:n,time:pt.time,done,prio});moved=e.date}
  else{r.name=n;r.time=pt.time;r.prio=prio}}}}
save();editing=null;anim=false;keepScroll(render);if(moved)toast("verschoben auf "+dLabel(moved))}

/* ---------- Touch: wischen, lange drücken, Tag wechseln ---------- */
const ACT=116;let openRow=null,g=null,suppress=false;
function closeSwipe(instant){if(!openRow)return;const r=openRow.querySelector(".rin");if(r){if(instant)r.style.transition="none";r.style.transform="";if(instant){r.offsetHeight;r.style.transition=""}}openRow=null}
function swallowClick(){suppress=true;setTimeout(()=>suppress=false,400)}
document.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
document.addEventListener("touchstart",e=>{
 if(e.touches.length>1){cancelGesture();return}
 const t=e.touches[0],tgt=e.target;
 if(editing||adding){g=null;return}
 if(openRow&&!tgt.closest(".acts")){const same=tgt.closest(".row")===openRow;if(!same){closeSwipe();swallowClick();g=null;return}}
 if(tgt.closest(".acts")){g=null;return}
 const row=tgt.closest("#lst .row,#carry .row");
 g={x0:t.clientX,y0:t.clientY,row:row&&!row.dataset.busy?row:null,mode:null};
 if(g.row&&g.row.closest("#lst")&&g.row!==openRow)g.lp=setTimeout(startDrag,430);
},{passive:true});
let gRaf=0;
function gPaint(){gRaf=0;if(!g)return;
 if(g.mode=="swipe"&&g.row){g.row.querySelector(".rin").style.transform=`translate3d(${g.off}px,0,0)`}
 if(g.mode=="day"){const p=$("#pane");if(p){const x=g.dx*0.9;p.style.transform=`translate3d(${x}px,0,0)`;p.style.opacity=String(Math.max(.35,1-Math.abs(x)/520))}}}
document.addEventListener("touchmove",e=>{if(!g)return;const t=e.touches[0],now=performance.now();let dx=t.clientX-g.x0;const dy=t.clientY-g.y0;
 if(g.mode=="drag"){e.preventDefault();moveDrag(dy);return}
 if(!g.mode){if(Math.abs(dx)<7&&Math.abs(dy)<7)return;clearTimeout(g.lp);
  if(Math.abs(dx)>Math.abs(dy)*1.15){g.mode=g.row?"swipe":(view=="main"?"day":"none");g.x0=t.clientX;dx=0;
   if(g.mode=="swipe")g.row.querySelector(".rin").style.transition="none";
   if(g.mode=="day"){const p=$("#pane");if(p)p.style.transition="none"}}
  else g.mode="scroll"}
 if(g.mode=="swipe"||g.mode=="day"){e.preventDefault();
  if(g.lt){const v=(t.clientX-g.lx)/Math.max(1,now-g.lt);g.vx=g.vx==null?v:g.vx*0.6+v*0.4}g.lx=t.clientX;g.lt=now}
 if(g.mode=="swipe"){const base=g.row===openRow?-ACT:0;let off=base+dx;
  if(off>0)off=off*0.25;if(off<-ACT)off=-ACT+(off+ACT)*.3;g.off=off}
 if(g.mode=="day")g.dx=dx;
 if(!gRaf)gRaf=requestAnimationFrame(gPaint)
},{passive:false});
const SNAP="transform .3s cubic-bezier(.2,.9,.25,1)";
function finishGesture(ok){if(!g)return;const m=g.mode,vx=g.vx||0;clearTimeout(g.lp);if(gRaf){cancelAnimationFrame(gRaf);gRaf=0}
 if(m=="drag"){endDrag(ok);swallowClick()}
 if(m=="swipe"){const rin=g.row.querySelector(".rin");rin.style.transition=SNAP+",background .3s";
  const open=ok&&g.off!=null&&(vx<-0.25||(vx<=0.25&&g.off<-ACT/2));
  if(open){if(openRow&&openRow!==g.row)closeSwipe();rin.style.transform=`translate3d(${-ACT}px,0,0)`;if(openRow!==g.row)haptic();openRow=g.row}
  else{rin.style.transform="";if(openRow===g.row)openRow=null}swallowClick()}
 if(m=="day"){const p=$("#pane"),dx=g.dx||0,go=ok&&(Math.abs(dx)>70||(Math.abs(vx)>0.3&&Math.abs(dx)>20)),dir=(Math.abs(dx)>20?dx:vx)<0?1:-1;
  if(p){if(go){p.style.transition="transform .16s ease-in,opacity .16s ease-in";p.style.transform=`translate3d(${-dir*innerWidth*0.5}px,0,0)`;p.style.opacity="0";setTimeout(()=>day(dir),150)}
   else{p.style.transition=SNAP+",opacity .3s";p.style.transform="";p.style.opacity=""}}
  swallowClick()}
 g=null}
function cancelGesture(){finishGesture(false)}
document.addEventListener("touchend",()=>finishGesture(true));
document.addEventListener("touchcancel",cancelGesture);

/* Reihenfolge per langem Drücken */
let drag=null;
function startDrag(){if(!g||!g.row||g.mode)return;const row=g.row,rws=[...row.parentNode.querySelectorAll(":scope > .row")];if(rws.length<2)return;
 closeSwipe(true);g.mode="drag";const gap=rws[1].offsetTop-rws[0].offsetTop-rws[0].offsetHeight;
 drag={row,rows:rws,idx:rws.indexOf(row),gap,shift:row.offsetHeight+gap,top0:row.offsetTop,ni:null};
 rws.forEach(r=>{if(r!==row)r.classList.add("shift")});row.classList.add("dragging");haptic();try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}}
function moveDrag(dy){if(!drag)return;const {rows,row,idx,shift,top0}=drag,first=rows[0],last=rows[rows.length-1];
 const min=first.offsetTop-top0,max=last.offsetTop+last.offsetHeight-row.offsetHeight-top0;
 const y=Math.max(min,Math.min(max,dy));row.style.transform=`translateY(${y}px)`;
 const center=top0+y+row.offsetHeight/2;let ni=0;
 rows.forEach(r=>{if(r!==row&&r.offsetTop+r.offsetHeight/2<center)ni++});
 rows.forEach((r,i)=>{if(r===row)return;let t=0;if(idx<i&&i<=ni)t=-shift;else if(ni<=i&&i<idx)t=shift;r.style.transform=t?`translateY(${t}px)`:""});
 drag.ni=ni}
function endDrag(commit){const d=drag;drag=null;if(!d)return;const {rows,row,idx}=d,ni=d.ni==null?idx:d.ni;
 let target=0;if(ni>idx)for(let i=idx+1;i<=ni;i++)target+=rows[i].offsetHeight+d.gap;else for(let i=ni;i<idx;i++)target-=rows[i].offsetHeight+d.gap;
 row.style.transition="transform .15s ease";row.style.transform=`translateY(${commit?target:0}px)`;
 if(!commit)rows.forEach(r=>r.style.transform="");
 setTimeout(()=>{if(commit&&ni!==idx){const keys=rows.map(r=>r.dataset.key);const [m]=keys.splice(idx,1);keys.splice(ni,0,m);applyOrder(row.parentNode,rows.map(r=>r.dataset.key),keys)}
  anim=false;keepScroll(render)},160)}
function applyOrder(lst,oldKeys,newKeys){
if(lst.dataset.rt){const map=new Map(st.routines.map(r=>[r.id,r]));const rest=st.routines.filter(r=>!newKeys.includes(r.id));st.routines=[...newKeys.map(k=>map.get(k)).filter(Boolean),...rest];save();return}
const k=lst.dataset.day,full=items(D(k)).map(x=>x.key),pos=oldKeys.map(x=>full.indexOf(x)).filter(p=>p>=0).sort((a,b)=>a-b);
pos.forEach((p,i)=>full[p]=newKeys[i]);st.order[k]=full;save()}

function pick(y,m,d){if(editing)saveEdit();sel=new Date(y,m,d,12);adding=false;anim=false;keepScroll(render)}
function mv(s){sel=new Date(sel.getFullYear(),sel.getMonth()+s,1,12);anim=false;render()}

/* ---------- Daten sichern / laden ---------- */
async function exportData(){const json=JSON.stringify(st,null,2),name="filer-"+iso(new Date())+".json";
try{const f=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Filer"});return}}catch(e){if(e&&e.name=="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function importData(){const f=$("#file");f.value="";f.click()}
$("#file").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;
try{const d=JSON.parse(await file.text());if(!d||typeof d!="object"||!("days" in d||"routines" in d))throw 0;
 if(!confirm("Aktuelle Einträge durch die Datei ersetzen?"))return;
 loadState(d);
 save();openOpt=null;view="main";cur=T;render();toast("Daten geladen")}catch(_){toast("Datei passt nicht")}});

/* ---------- Tastatur & Tippen außerhalb ----------
   Enter, „Fertig“ oder Tastatur zuklappen speichert sofort – kein Zwischenschritt. */
let wrapTap=false;
function refocus(){const f=document.querySelector(".addwrap .fn,.editwrap .fn");if(f)f.focus()}
/* again=true (Enter): nach dem Speichern öffnet sich direkt die nächste Zeile */
function commitInput(again){if(editing){saveEdit();return}if(adding){const f=$(".addwrap .fn");if(f&&f.value.trim())submit(again);else closeAdd()}}
function enterGo(e){if(e)e.preventDefault();commitInput(true)}
document.addEventListener("focusout",e=>{const w=e.target.closest&&e.target.closest(".addwrap,.editwrap");if(!w)return;if(hapEl&&e.relatedTarget===hapEl.firstChild){e.target.focus();return}
 setTimeout(()=>{if(!w.isConnected||wrapTap)return;const a=document.activeElement;if(a&&w.contains(a))return;
  if(editing&&editing.box===w)saveEdit();else if(adding&&w.classList.contains("addwrap"))commitInput()},80)});
document.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".addwrap,.editwrap")){wrapTap=true;setTimeout(()=>wrapTap=false,450)}},true);
document.addEventListener("keydown",e=>{
const ent=e.key==="Enter"||e.keyCode===13;
if(editing){if(e.key==="Escape"){cancelEdit();return}if(ent){e.preventDefault();saveEdit()}return}
if(adding){if(e.key==="Escape"){closeAdd();return}if(ent){e.preventDefault();commitInput(true)}return}
if(view=="main"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();day(e.key==="ArrowLeft"?-1:1)}});
document.addEventListener("pointerdown",e=>{const t=e.target;
if(editing&&!t.closest(".editwrap")){saveEdit();swallowClick();return}
if(adding&&!t.closest(".addwrap")){const f=$(".addwrap .fn");if(f&&f.value.trim())submit();else closeAdd();swallowClick()}});

/* ---------- Sync über GitHub ----------
   Jede Änderung landet als filer.json im privaten Repo <dein-name>/filer-data.
   Beim Öffnen holt Filer den neueren Stand. Der Schlüssel bleibt nur auf diesem Gerät. */
const GH_REPO="filer-data",GH_FILE=APP=="filer2"?"filer-2.json":"filer.json";
let gh=(()=>{try{return JSON.parse(localStorage.getItem(APP+".gh")||"null")}catch(_){return null}})(),ghSha=null,pushT=null,pushing=false,pushAgain=false,syncState="",syncAt=0;
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,""))));
function ghApi(path,opt={}){return fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}})}
const ghPath=()=>`/repos/${gh.login}/${GH_REPO}/contents/${GH_FILE}`;
function setSync(s){syncState=s;if(s=="ok")syncAt=Date.now();const l=document.getElementById("synclbl");if(l)l.textContent=syncLabel()}
function syncLabel(){if(!gh)return "aus";if(syncState=="err")return "fehler";if(syncState=="busy")return "…";if(syncAt){const d=new Date(syncAt);return "✓ "+pad(d.getHours())+":"+pad(d.getMinutes())}return "an"}
async function ghPull(){const r=await ghApi(ghPath());if(r.status==404){ghSha=null;return null}if(!r.ok)throw new Error(r.status);const j=await r.json();ghSha=j.sha;return JSON.parse(b64d(j.content))}
async function ghPush(){if(!gh)return;if(pushing){pushAgain=true;return}pushing=true;setSync("busy");
 try{for(let i=0;i<2;i++){const body={message:"Filer "+new Date().toLocaleString("de-DE"),content:b64e(JSON.stringify(st,null,1))};if(ghSha)body.sha=ghSha;
   const r=await ghApi(ghPath(),{method:"PUT",body:JSON.stringify(body)});
   if(r.ok){ghSha=(await r.json()).content.sha;setSync("ok");break}
   if(r.status==409||r.status==422){await ghPull();continue}
   if(r.status==401||r.status==403){setSync("err");toast("Sync: Schlüssel ungültig");break}
   throw new Error(r.status)}}catch(_){setSync("err")}
 pushing=false;if(pushAgain){pushAgain=false;ghPush()}}
function schedulePush(){if(!gh)return;clearTimeout(pushT);pushT=setTimeout(ghPush,1200)}
let pullBusy=false;
async function pullIfNewer(){if(!gh||pullBusy)return;pullBusy=true;
 try{const d=await ghPull();if(!d){await ghPush();pullBusy=false;return}
  if((d.updatedAt||0)>(st.updatedAt||0)){const apply=()=>{if(adding||editing||drag){setTimeout(apply,1500);return}loadState(d);storeLocal();anim=false;keepScroll(render)};apply();setSync("ok")}
  else if((d.updatedAt||0)<(st.updatedAt||0))await ghPush();else setSync("ok")}catch(_){setSync("err")}pullBusy=false}
function syncInit(){if(gh)pullIfNewer()}
setInterval(()=>{if(!document.hidden)pullIfNewer()},60000);
function syncView(){if(gh)return `<div class="muted" style="padding:0 10px 14px;line-height:1.7">verbunden mit<br><span style="color:var(--ink)">${esc(gh.login)}/${GH_REPO}</span><br>Stand: <span id="synclbl">${syncLabel()}</span></div>`+
 `<div class="mi" onclick="syncNow()">jetzt abgleichen</div><div class="mi" onclick="syncOff()">trennen</div>`;
 return `<div class="muted" style="padding:0 10px 14px;font-size:13px;line-height:1.7">Speichert jede Änderung in deinem privaten GitHub-Repo <b>${GH_REPO}</b>. So sind deine Einträge überall gleich – über den Link, das Icon oder den Mac.</div>`+
 `<form class="addrow" style="margin:0 0 10px" onsubmit="event.preventDefault();syncOn()" autocomplete="on"><input type="text" name="username" value="filer" autocomplete="username" style="display:none"><input id="ghtok" type="password" name="password" autocomplete="current-password" placeholder="GitHub-Schlüssel einfügen" style="flex:1;min-width:0" enterkeyhint="go"></form>`+
 `<div class="mi" onclick="syncOn()">verbinden</div>`}
async function syncOn(){const i=$("#ghtok"),tok=i?i.value.trim():"";if(!tok){toast("Schlüssel einfügen");return}
 if(i)i.blur();toast("verbinde …");
 try{const r=await fetch("https://api.github.com/user",{cache:"no-store",headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"}});
  if(!r.ok){toast("Schlüssel ungültig");return}const login=(await r.json()).login;gh={token:tok,login};
  const rr=await ghApi(`/repos/${login}/${GH_REPO}`);if(!rr.ok){gh=null;toast(rr.status==404?"Repo "+GH_REPO+" nicht gefunden":"kein Zugriff auf "+GH_REPO);return}
  const d=await ghPull();
  try{localStorage.setItem(APP+".gh",JSON.stringify(gh))}catch(_){}
  if(d&&countOf(d)[0]>0){const mine=countOf(st)[0];
   if(!mine||confirm("Online liegen schon "+countOf(d)[0]+" Einträge. Diese laden?\n\nAbbrechen = deine "+mine+" Einträge von hier hochladen.")){loadState(d);storeLocal();setSync("ok")}
   else await ghPush()}
  else await ghPush();
  haptic();anim=false;render();toast("Sync an")}catch(_){gh=null;toast("Verbindung fehlgeschlagen")}}
async function syncNow(){await pullIfNewer();if(syncState!="err")await ghPush();anim=false;render();toast(syncState=="err"?"Sync fehlgeschlagen":"abgeglichen")}
function syncOff(){if(!confirm("Sync auf diesem Gerät trennen? Deine Einträge bleiben hier und online erhalten."))return;gh=null;ghSha=null;try{localStorage.removeItem(APP+".gh")}catch(_){}anim=false;render()}

/* ---------- Tastatur: Eingabezeile immer sichtbar über der Tastatur ---------- */
function kbHeight(){const v=window.visualViewport;return v?Math.max(0,window.innerHeight-v.height-v.offsetTop):0}
function showInput(){const f=document.querySelector(".addwrap,.editwrap");if(!f)return;const v=window.visualViewport,a=$("#app"),
 top=(v?v.offsetTop:0),visH=v?v.height:window.innerHeight,r=f.getBoundingClientRect(),want=top+visH*0.42;
 if(r.bottom>top+visH-24||r.top<top+60)a.scrollTo({top:a.scrollTop+(r.top-want),behavior:"smooth"})}
function fitKeyboard(){const kb=kbHeight();document.documentElement.style.setProperty("--kb",kb+"px");if(window.scrollY)window.scrollTo(0,0);if(kb>0)showInput()}
if(window.visualViewport){visualViewport.addEventListener("resize",fitKeyboard);visualViewport.addEventListener("scroll",()=>{if(window.scrollY)window.scrollTo(0,0)})}
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches(".fn,.ft")){setTimeout(fitKeyboard,60);setTimeout(fitKeyboard,350)}});

/* ---------- neuer Tag ---------- */
function rollDay(){const n=noon(new Date());if(iso(n)!==iso(T)){if(iso(cur)==iso(T))cur=n;T=n;if(!adding&&!editing){anim=false;render()}}}
setInterval(rollDay,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){rollDay();markLate()}});
window.addEventListener("pageshow",rollDay);

render();
(async()=>{let had=null;try{had=localStorage.getItem(APP)}catch(_){}
 if(!had){const j=await idbGet("kv","state");if(j){try{loadState(JSON.parse(j));storeLocal();anim=false;render();toast("Daten wiederhergestellt");syncInit();return}catch(_){}}}
 else idbSave(had);
 let hint=null;try{hint=localStorage.getItem(APP+".hint")}catch(_){}
 if(!hint&&!st.seenHint){setTimeout(()=>toast("Tipp: Menü › Bedienung"),900);try{localStorage.setItem(APP+".hint","1")}catch(_){}}
 syncInit()})();
/* Updates: neue Version suchen, sobald Filer geöffnet wird, und dann einmal neu laden */
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||reloaded||adding||editing)return;reloaded=true;location.reload()});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{}))}
/* Beim Zurückkehren in die App: neue Version auf GitHub? Dann einmal neu laden. */
let lastCheck=0;
async function checkUpdate(){if(Date.now()-lastCheck<20000)return;lastCheck=Date.now();
 try{const t=await (await fetch("index.html?_="+Date.now(),{cache:"no-store"})).text(),m=t.match(/const VERSION="([^"]+)"/);
  if(m&&m[1]!==VERSION){const go=()=>{if(adding||editing||drag){setTimeout(go,1500);return}location.reload()};go()}}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkUpdate();pullIfNewer()}});
window.addEventListener("load",()=>setTimeout(checkUpdate,1500));
</script>
