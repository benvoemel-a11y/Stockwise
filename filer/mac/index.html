<!doctype html>
<html lang="de">
<head>

<title>Filer</title>
<style>
html,body{margin:0;height:100%;background:#8a8a8a;overflow:hidden}
body{color:#171717;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;line-height:1.55;-webkit-user-select:none;user-select:none;cursor:default}

#app::-webkit-scrollbar{width:6px}#app::-webkit-scrollbar-thumb{background:#777777;border-radius:3px}
.fade{animation:fin .28s ease}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.ic svg{width:18px;height:18px}.gear svg{width:20px;height:20px}.gear:hover{transform:rotate(60deg)}

.row .n{flex:1;color:#171717;transition:color .35s ease;word-break:break-word}.row .nt{background:linear-gradient(#676767,#676767) no-repeat 0 55%/0 1px;transition:background-size .35s ease}
.row .t{color:#464646;text-align:right;transition:color .35s}.row .r{color:#5b5b5b}.row .x{color:transparent;width:12px;transition:color .2s}.row:hover .x{color:#777}.row .x:hover{color:#000}
.row.late:not(.done) .n,.row.late:not(.done) .t{color:#d93f37}
.done .n{color:#676767}.done .nt{background-size:100% 1px}.done .t{color:#676767}

.days{display:flex;gap:10px;padding:6px 8px 0;font-size:13px}.dy{cursor:pointer;color:#676767;transition:color .2s,transform .15s}.dy:active{transform:scale(.85)}.dy.on{color:#2b2b2b;text-decoration:underline}
.strip+.plus,.hd+.plus{margin-top:0}#carry+#lst,#carry+.plus{margin-top:0}.strip+.addwrap .addrow,.hd+.addwrap .addrow{margin-top:0}
.closing{transition:opacity .18s ease,transform .18s ease;opacity:0;transform:translateY(-3px)}
.mi{padding:10px 8px;cursor:pointer;transition:background .2s,padding-left .2s}.mi:hover{background:#838383;padding-left:12px}.mi:active{background:#7c7c7c}

.calhd{display:flex;align-items:center;gap:8px;margin-bottom:2px}.calm{font-weight:700;font-size:16px}.calhd .sp{flex:1}.stk{font-weight:700;font-size:12px}
.calsub{color:#4a4a4a;font-size:12px;margin-bottom:16px}

.tile:hover{filter:brightness(1.12)}.tile:active{transform:scale(.9)}
.tile.l1,.tile.l2{color:#cfcfcf}.tile.l3,.tile.l4{color:#e2e2e2}.tile.fut{color:#707070}.tile.past{color:#cfcfcf}
.tile.today{box-shadow:inset 0 0 0 1.5px #1c1c1c}.tile.l3.today,.tile.l4.today{box-shadow:inset 0 0 0 1.5px #a8a8a8}
.tile.sel{box-shadow:0 0 0 2px #8a8a8a,0 0 0 3.5px #1c1c1c}
.legend{display:flex;align-items:center;gap:5px;color:#4a4a4a;font-size:11px}.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}.legend span:first-child{margin-right:4px}.legend span:last-child{margin-left:4px}
.mrow{display:flex;align-items:center;gap:8px}.mrow .sp{flex:1}.dw{width:66px;text-align:center}.reveal .hit{padding:6px 10px;margin:-6px -10px;position:relative;z-index:1;touch-action:manipulation}.reveal .hit i{font-style:normal;display:inline-block}
.row{position:relative}.row .e,.row .x{position:absolute;top:50%;margin-top:-8px;height:16px;display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,color .2s}
.row .x{right:8px;width:12px}.row .e{right:28px;width:12px}.s3 .row .x{right:14px}.s3 .row .e{right:34px}
.row:hover .e,.row:hover .x{opacity:1}.row .t,.row .r{transition:transform .22s ease,color .35s}.row:hover .t,.row:hover .r{transform:translateX(-46px)}
body.isdrag .row .t,body.isdrag .row .r{transform:none!important}
.reveal{display:inline-flex;align-items:center;gap:8px;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0);opacity:0;transform:translateX(-10px);pointer-events:none;transition:clip-path .32s ease,-webkit-clip-path .32s ease,opacity .25s,transform .32s ease}.mrow.open .reveal{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);opacity:1;transform:none;pointer-events:auto}
.dw{position:relative;display:inline-block;height:1.55em;line-height:1.55em;overflow:hidden;vertical-align:middle;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}.trk>div{height:1.55em;text-align:center;white-space:nowrap}.ghost{position:absolute;left:0;right:0;top:0;text-align:center;pointer-events:none;animation:flipO .14s ease forwards}.mrow{cursor:pointer}
.pct{font-size:11px;color:#4a4a4a;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.nt{cursor:pointer;padding:3px 6px;margin:-3px -6px;background-origin:content-box!important;background-clip:content-box!important}.row{cursor:default}
.trh{color:#d93f37;font-size:11px;letter-spacing:.08em;font-weight:700;margin:22px 0 8px 8px}
.trow .nt{color:#d93f37;text-decoration:line-through;text-decoration-color:#d93f37}.trow .t{color:#b0453f;font-size:11px}.trow:hover .t,.trow:hover .r{transform:none}
.trow.ask .t{color:#1c1c1c}
.nst{color:#3a3a3a;font-size:12px;margin-right:4px;transition:opacity .2s}.mrow.open .nst{opacity:0;width:0;margin:0;overflow:hidden}
.nopt{gap:12px}.opt2{cursor:pointer;color:#3a3a3a;font-size:11.5px;transition:color .2s,transform .15s}.opt2:hover{color:#000}.opt2.hitok{animation:pop .3s ease}
.muted{color:#777}
.dsw{position:relative;display:inline-flex;gap:8px;margin-left:auto;margin-right:14px;padding-bottom:5px}
.dsi{width:24px;height:20px;display:flex;justify-content:center;color:#5a5a5a;cursor:pointer;transition:color .28s}.dsi.on{color:#171717}.dsi svg{width:20px;height:20px}
.dsu{position:absolute;left:0;bottom:0;width:24px;height:2px;background:#171717;transition:transform .32s cubic-bezier(.22,.9,.25,1)}.dsw.at-iphone .dsu{transform:translateX(calc(100% + 8px))}
.devtag{margin-left:auto;margin-right:10px;font-size:11px;font-weight:400;color:#3a3a3a;letter-spacing:.04em;animation:pop .25s ease}
.lktx{color:#3a3a3a;font-size:12px;line-height:1.7;padding:0 8px 12px}.lktx b{color:#171717;font-weight:600}
.lkcode{font-size:18px;letter-spacing:.12em;-webkit-user-select:text;user-select:text}
.lkrow{margin:0 0 12px}.lkrow input{flex:1;min-width:0;letter-spacing:.08em}
.dots{display:flex;gap:12px;padding:2px 8px 12px;align-items:center}.cdot{width:14px;height:14px;border-radius:50%;cursor:pointer;box-sizing:border-box;transition:transform .15s,box-shadow .2s}.cdot:hover{transform:scale(1.15)}.cdot:active{transform:scale(.85)}.cdot.on{box-shadow:0 0 0 2px #8a8a8a,0 0 0 3.5px #1f1f1f}
.pm{display:inline-flex;align-items:center;justify-content:center;width:12px;color:#4f4f4f;flex:none}.pm svg{width:12px;height:12px}.pm.sp{visibility:hidden}
.prio .nt{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:#1f1f1f}.prio.done .nt{text-decoration:none}.prio.done .pm{color:#737373}
.row.late:not(.done) .nt{text-decoration-color:#d93f37}
.pri{cursor:pointer;color:#737373;display:inline-flex;align-items:center;width:12px;transition:color .2s,transform .15s}.pri svg{width:12px;height:12px}.pri:hover{color:#2b2b2b}.pri.on{color:#171717}.pri:active{transform:scale(.8)}
.dnav{display:flex;align-items:center;gap:8px}.ar{color:#464646;font-weight:400;cursor:pointer;padding:0 2px;transition:color .2s,transform .15s}.ar:hover{color:#000}.ar:active{transform:scale(.8)}
.tdy{font-size:11px;color:#777;font-weight:400;text-decoration:underline;cursor:pointer;margin-left:2px;animation:pop .25s ease}.tdy:hover{color:#000}
@keyframes kl{0%,100%{transform:none}40%{transform:translateX(-6px)}}@keyframes kr{0%,100%{transform:none}40%{transform:translateX(6px)}}.kl{animation:kl .3s ease}.kr{animation:kr .3s ease}
@keyframes flipO{to{opacity:0;transform:translateY(-8px)}}@keyframes flipI{from{opacity:0;transform:translateY(8px)}}.dtx{display:inline-block}
.slL{animation:slL .22s ease}.slR{animation:slR .22s ease}@keyframes slL{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}@keyframes slR{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.row .e{color:transparent;display:inline-flex;align-items:center;transition:color .2s}.row .e svg{width:12px;height:12px}.row:hover .e{color:#777}.row .e:hover{color:#000}
.row.dragging{background:#838383;position:relative;z-index:2;cursor:grabbing;transition:none!important}
.row.shift{transition:transform .18s ease}
body.isdrag,body.isdrag *{cursor:grabbing!important}body.isdrag .row:not(.dragging):hover{background:transparent}body.isdrag .row .x,body.isdrag .row .e{color:transparent!important}
.editwrap{margin:0}.editwrap .addrow{margin-top:0}.s2 .editwrap,.s3 .editwrap{margin-bottom:8px}
.dline{align-items:center}.dline .dl{color:#2b2b2b;min-width:0}.dline .dy{padding:0 2px}
#toast{position:fixed;left:50%;bottom:14px;transform:translate(-50%,6px);background:#7e7e7e;color:#1f1f1f;font-size:12px;padding:3px 10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.s1 .row{font-size:12px;padding:1px 8px}.s2 .row{margin-bottom:8px}.s3 .row{margin-bottom:12px;padding:8px 14px;font-size:19px;font-weight:600}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const W=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"],WS=["Mo","Di","Mi","Do","Fr","Sa","So"],
M=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
S=["klein","normal","groß"],DOTS=[["rot","#d93f37"],["schwarz","#171717"],["weiss","#ffffff"],["pink","#ff4f9a"],["blau","#2f7cf6"],["orange","#f47b2a"],["gelb","#ffcc00"],["gruen","#34c759"]],L=[["normal","normal"],["front","vorne"],["back","hinten"]];
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const FLAG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5z"/><path d="M7 4h11l-3 4.5L18 13H7z"/></svg>';
const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const noon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
const wd=d=>(d.getDay()+6)%7;
const nice=d=>W[wd(d)]+", "+d.getDate()+". "+M[d.getMonth()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const newId=()=>Math.random().toString(16).slice(2,10);
const D=k=>new Date(k+"T12:00:00");

/* ---------- Daten ---------- */
let st=Object.assign({days:{},routines:[],rdone:{},rskip:{},order:{},size:1,level:"normal"},window.FILER_DATA||(()=>{try{return JSON.parse(localStorage.getItem("filer")||"null")}catch(e){return null}})()||{});
if(!st.order)st.order={};
function save(){for(const k of ["days","rdone","rskip","order"])for(const d in st[k])if(!st[k][d]||!st[k][d].length)delete st[k][d];
st.updatedAt=Date.now();if(dev!=OWN){saveOther();return}writeLocal(st);linkPushSoon()}
function writeLocal(o){const json=JSON.stringify(o,null,2);
try{window.webkit.messageHandlers.filer.postMessage({type:"save",json})}catch(e){try{localStorage.setItem("filer",json)}catch(_){}}}
function native(type,value){try{window.webkit.messageHandlers.filer.postMessage({type,value})}catch(e){}}

function items(d){const k=iso(d),dn=st.rdone[k]||[],sk=st.rskip[k]||[];
const all=[...(st.days[k]||[]).map(h=>({name:h.name,time:h.time,done:h.done,prio:!!h.prio,key:"h"+h.id})),
...st.routines.filter(r=>r.days.includes(wd(d))&&!sk.includes(r.id)).map(r=>({name:r.name,time:r.time,done:dn.includes(r.id),prio:!!r.prio,key:"r"+r.id}))]
.sort(byTime);return chrono(all,st.order[k])}
function byTime(a,b){return (a.time==null)-(b.time==null)||(a.time||"").localeCompare(b.time||"")}
/* Einträge mit Uhrzeit stehen immer zeitlich sortiert, Einträge ohne Uhrzeit behalten ihren Platz */
function chrono(base,o){if(!o||!o.length)return base;const map=new Map(base.map(x=>[x.key,x]));
const list=o.filter(k=>map.has(k)).map(k=>map.get(k)),known=new Set(list.map(x=>x.key));
base.filter(x=>!known.has(x.key)).forEach(x=>{if(x.time==null){list.push(x);return}
 let at=list.findIndex(y=>y.time!=null&&y.time>x.time);
 if(at<0){let last=-1;list.forEach((y,i)=>{if(y.time!=null)last=i});at=last+1}
 list.splice(at,0,x)});
const slots=[];list.forEach((x,i)=>{if(x.time!=null)slots.push(i)});
const timed=slots.map(i=>list[i]).sort(byTime);slots.forEach((i,j)=>list[i]=timed[j]);return list}
function setDone(k,key){const id=key.slice(1);if(key[0]=="h"){const x=(st.days[k]||[]).find(x=>x.id==id);x.done=!x.done;save();return x.done}
const l=st.rdone[k]=st.rdone[k]||[];const i=l.indexOf(id);if(i<0)l.push(id);else l.splice(i,1);save();return i<0}

/* ---------- Zustand ---------- */
let slide="",T=noon(new Date()),cur=T,view="main",sel=T,adding=false,addKey=null,openOpt=null,newDays=[0,1,2,3,4,5,6],anim=true;
const TM=()=>new Date(T.getFullYear(),T.getMonth(),T.getDate()+1,12);

/* ---------- Bausteine ---------- */
function rows(d,hide){let h=items(d);const all=h.length;if(hide)h=h.filter(x=>!x.done);
if(!h.length)return hide&&all?'<div class="muted" style="padding:2px 8px">alles erledigt</div>':(view=="cal"?'<div class="muted" style="padding:2px 8px">keine Einträge</div>':"");
const anyP=h.some(x=>x.prio)||(view=="main"&&iso(d)==iso(T)&&Object.keys(st.days).some(k=>k<iso(T)&&st.days[k].some(x=>!x.done&&x.prio)));return '<div class="s'+(st.size+1)+'" id="lst" data-day="'+iso(d)+'">'+h.map(x=>`<div class="row ${x.done?"done":""} ${x.prio?"prio":""}" data-n="${esc(x.name)}" data-key="${x.key}">${anyP?`<span class="pm ${x.prio?"":"sp"}">${FLAG}</span>`:""}<span class="n"><span class="nt" onclick="event.stopPropagation();tg('${iso(d)}','${x.key}',${hide},this.closest('.row'))">${esc(x.name)}</span></span><span class="t">${x.time||""}</span><span class="e" title="Bearbeiten" onclick="event.stopPropagation();editItem('${iso(d)}','${x.key}',this.parentNode)">${PEN}</span><span class="x" onclick="event.stopPropagation();del('${iso(d)}','${x.key}',this.parentNode)">×</span></div>`).join("")+'</div>'}
function carryRows(){const t=iso(T),out=[];
Object.keys(st.days).filter(k=>k<t).sort().forEach(k=>(st.days[k]||[]).filter(h=>!h.done).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).forEach(h=>out.push({k,h})));
if(!out.length)return "";const anyC=out.some(o=>o.h.prio)||items(T).some(x=>x.prio&&!x.done);
return '<div class="s'+(st.size+1)+'" id="carry">'+out.map(({k,h})=>{const d=D(k),r=relDay(d),lab=(r||WS[wd(d)]+" "+d.getDate()+"."+(d.getMonth()+1)+".")+(h.time?" "+h.time:"");
return `<div class="row late ${h.prio?"prio":""}" data-key="h${h.id}">${anyC?`<span class="pm ${h.prio?"":"sp"}">${FLAG}</span>`:""}<span class="n"><span class="nt" onclick="event.stopPropagation();tg('${k}','h${h.id}',true,this.closest('.row'))">${esc(h.name)}</span></span><span class="t">${lab}</span><span class="e" title="Bearbeiten" onclick="event.stopPropagation();editItem('${k}','h${h.id}',this.parentNode)">${PEN}</span><span class="x" onclick="event.stopPropagation();del('${k}','h${h.id}',this.parentNode)">×</span></div>`}).join("")+'</div>'}
function shade(d){const h=items(d),r=h.length?h.filter(x=>x.done).length/h.length:0,s=Math.round(105*(1-r))+20;return [Math.round(r*100),`rgb(${s},${s},${s})`]}
function strip(d){const [w,c]=shade(d);return `<div class="strip" style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><div style="flex:1;height:4px;background:#7a7a7a"><div id="fill" style="height:4px;width:${w}%;background:${c};transition:width .5s ease,background .5s ease"></div></div><span id="pct" class="pct">${w} %</span></div>`}
function updStrip(d){if(view=="main")d=cur;const f=document.getElementById("fill");if(!f)return;const [w,c]=shade(d);f.style.width=w+"%";f.style.background=c;countPct(w)}
function countPct(to){const el=document.getElementById("pct");if(!el)return;const from=parseInt(el.textContent)||0;if(from===to)return;cancelAnimationFrame(el._r);const t0=performance.now();
const step=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e)+" %";if(k<1)el._r=requestAnimationFrame(step)};el._r=requestAnimationFrame(step)}
const plusHtml=key=>`<span class="plus" onclick="openAdd('${key}')">+</span>`;
function adder(key,routine){if(!adding)return plusHtml(key);
return `<div class="pop addwrap"><div class="addrow"><input class="fn" spellcheck="false"><span class="pri" title="Markieren" onclick="togPri(this)">${FLAG}</span><span class="clk" title="Uhrzeit hinzufügen" onclick="addTime()">${CLOCK}</span></div>`+
(routine?`<div class="days">${WS.map((s,i)=>`<span class="dy ${newDays.includes(i)?"on":""}" onclick="tday(${i},this)">${s}</span>`).join("")}</div>`:"")+`</div>`}

 Object.assign(drag,{started:true,rows,idx:rows.indexOf(drag.row),gap,shift:drag.row.offsetHeight+gap,top0:drag.row.offsetTop});
 rows.forEach(r=>{if(r!==drag.row)r.classList.add("shift")});drag.row.classList.add("dragging");document.body.classList.add("isdrag");
 try{drag.row.setPointerCapture(drag.pid)}catch(_){}}
const {rows,row,idx,shift,top0}=drag,first=rows[0],last=rows[rows.length-1];
const min=first.offsetTop-top0,max=last.offsetTop+last.offsetHeight-row.offsetHeight-top0;
const y=Math.max(min,Math.min(max,dy));row.style.transform=`translateY(${y}px)`;
const center=top0+y+row.offsetHeight/2;let ni=0;
rows.forEach((r,i)=>{if(r!==row&&r.offsetTop+r.offsetHeight/2<center)ni++});
rows.forEach((r,i)=>{if(r===row)return;let t=0;if(idx<i&&i<=ni)t=-shift;else if(ni<=i&&i<idx)t=shift;r.style.transform=t?`translateY(${t}px)`:""});
drag.ni=ni});
function endDrag(commit){const d=drag;drag=null;if(!d||!d.started)return;justDragged=true;setTimeout(()=>justDragged=false,0);
document.body.classList.remove("isdrag");const {rows,row,idx}=d,ni=d.ni==null?idx:d.ni;
let target=0;if(ni>idx)for(let i=idx+1;i<=ni;i++)target+=rows[i].offsetHeight+d.gap;else for(let i=ni;i<idx;i++)target-=rows[i].offsetHeight+d.gap;
row.style.transition="transform .15s ease";row.style.transform=`translateY(${commit?target:0}px)`;
if(!commit)rows.forEach(r=>r.style.transform="");
setTimeout(()=>{if(commit&&ni!==idx){const keys=rows.map(r=>r.dataset.key);const [m]=keys.splice(idx,1);keys.splice(ni,0,m);applyOrder(row.parentNode,rows.map(r=>r.dataset.key),keys)}
 anim=false;keepScroll(render)},160)}
document.addEventListener("pointerup",()=>endDrag(true));
document.addEventListener("pointercancel",()=>endDrag(false));

function applyOrder(lst,oldKeys,newKeys){
if(lst.dataset.rt){const map=new Map(st.routines.map(r=>[r.id,r]));const rest=st.routines.filter(r=>!newKeys.includes(r.id));st.routines=[...newKeys.map(k=>map.get(k)).filter(Boolean),...rest];save();return}
const k=lst.dataset.day,full=items(D(k)).map(x=>x.key),pos=oldKeys.map(x=>full.indexOf(x)).filter(p=>p>=0).sort((a,b)=>a-b);
pos.forEach((p,i)=>full[p]=newKeys[i]);st.order[k]=full;save()}

function ownApply(n){writeLocal(n);if(dev==OWN){st=n;anim=false;keepScroll(render)}else{ownBak=n;UIK.forEach(k=>{if(n[k]===undefined)delete st[k];else st[k]=n[k]})}}

/* ---------- Geräte verknüpfen: Mac ↔ iPhone ----------
   Jedes Gerät hat seinen eigenen Speicher und eigene Routinen.
   Mit einem gemeinsamen Code legen beide ihren Stand zusätzlich auf dem Server ab.
   Über „Gerät“ im Menü siehst und bearbeitest du die Einträge des anderen Geräts. */
const DEVN={mac:"Mac",iphone:"iPhone"};
const UIK=["size","light","level","dot","notify","seenHint"];
let link=linkLoad(),dev=OWN,ownBak=null,otherUI={},devBusy=false,devWant=null,lpT=null,lpBusy=false,lpAgain=false,otherT=null,opBusy=false,opAgain=false,linkState="",linkAt=0;
function ownSt(){return dev==OWN?st:ownBak}
function normalize(d){const o=Object.assign({days:{},routines:[],rdone:{},rskip:{},order:{},size:1},d||{});
 for(const k of ["days","rdone","rskip","order"])if(!o[k]||typeof o[k]!="object")o[k]={};if(!Array.isArray(o.routines))o.routines=[];return o}

function setLink(s){linkState=s;if(s=="ok")linkAt=Date.now();const l=document.getElementById("lnklbl");if(l)l.textContent=linkLabel()}
function linkLabel(){if(!link)return "aus";if(linkState=="err")return "keine verbindung";if(linkState=="busy")return "…";if(linkAt){const d=new Date(linkAt);return "✓ "+pad(d.getHours())+":"+pad(d.getMinutes())}return "an"}
function linkPushSoon(){if(!link)return;clearTimeout(lpT);lpT=setTimeout(linkPushOwn,1200)}
async function linkPushOwn(){if(!link)return;if(lpBusy){lpAgain=true;return}lpBusy=true;setLink("busy");
 try{await lput(OWN,ownSt());setLink("ok")}catch(_){setLink("err")}lpBusy=false;if(lpAgain){lpAgain=false;linkPushOwn()}}
async function linkPullOwn(){if(!link||lpBusy||lpT&&0)return;
 try{const d=await lget(OWN),o=ownSt();if(!d){await linkPushOwn();return}
  if((d.updatedAt||0)>(o.updatedAt||0)){const go=()=>{if(dev==OWN&&lbusy()){setTimeout(go,1500);return}ownApply(normalize(d))};go();setLink("ok")}
  else if((d.updatedAt||0)<(o.updatedAt||0))await linkPushOwn();else setLink("ok")}catch(_){setLink("err")}}
function viewOf(d){const v=normalize(d);otherUI={};UIK.forEach(k=>{if(k in v)otherUI[k]=v[k];if(ownBak[k]===undefined)delete v[k];else v[k]=ownBak[k]});return v}
function saveOther(){UIK.forEach(k=>{if(st[k]===undefined)delete ownBak[k];else ownBak[k]=st[k]});ownPersist();clearTimeout(otherT);otherT=setTimeout(pushOther,900)}
async function pushOther(){otherT=null;if(dev!=OTHER||!link)return;if(opBusy){opAgain=true;return}opBusy=true;setLink("busy");
 const out=Object.assign({},st);UIK.forEach(k=>{if(k in otherUI)out[k]=otherUI[k];else delete out[k]});
 try{await lput(OTHER,out);setLink("ok")}catch(_){setLink("err");toast("nicht gespeichert – keine Verbindung")}
 opBusy=false;if(opAgain){opAgain=false;pushOther()}}
async function refreshOther(){if(dev!=OTHER||!link||opBusy||otherT||lbusy())return;
 try{const d=await lget(OTHER);if(d&&dev==OTHER&&(d.updatedAt||0)>(st.updatedAt||0)&&!lbusy()){st=viewOf(d);anim=false;keepScroll(render)}setLink("ok")}catch(_){}}

 if(to==OTHER&&!link){toast("erst unter Verknüpfen koppeln");setTimeout(devFail,260);return}

/* Code: 12 Zeichen, z. B. K7Q2-M9XP-4TRA */
const CA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,"$1-");
const cleanCode=t=>String(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/O/g,"0").replace(/I/g,"1");
function newCode(){const a=crypto.getRandomValues(new Uint8Array(12));return [...a].map(x=>CA[x%32]).join("")}
